name: Deploy TechBrain to Vercel

# Se lanza a mano hasta que existan los secrets VERCEL_TOKEN, VERCEL_ORG_ID
# y VERCEL_PROJECT_ID. Sin ellos el job falla, y mientras tanto el
# despliegue se hace con scripts/deploy-demo.sh.
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Flutter Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter installation
        run: flutter doctor -v

      - name: Install dependencies
        working-directory: ./frontend
        run: flutter pub get

      - name: Run Tests
        working-directory: ./frontend
        run: flutter test

      - name: Build Web Release
        working-directory: ./frontend
        run: flutter build web --release

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend/build/web
          vercel-args: '--prod'
