name: techbrain
description: "TechBrain: rutas de aprendizaje personalizadas con el catálogo de DevTalles."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  riverpod_annotation: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.9
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/data/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
